<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southport Key Club - Profile</title>
    
    <link rel="stylesheet" href ="css_files/common.css">
    <link rel="stylesheet" href="css_files/profile.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src = "js_files/profile.js" defer></script>
</head>
<body>
    <a href ="landingpage.html">go landing page</a>
    <section class="header">
        <div class ="profile-header">
            <img src="images/profile.png" alt="Profile Picture">
            <h1 id="username">User Name</h1>
            <div class="profile-buttons">
                <button class="edit-profile-button">Edit Profile</button>
                <button id="logout-button" class="logout-button">Logout</button>
            </div>
        </div>
        <div class ="description">
            <p id ="description">Description</p>
        </div>
        <div class ="qr-code-center">
          <div class="qr-code-container" id="qrCodeContainer">
             <img>
             <!-- QR code will be displayed here -->
         </div>
        </div>
    </section>

    <section class="main-content">
        <div class ="service-hours-board">
            <div class ="service-hours">
                <h2>Service Hours</h2>
                <p id = "studentHours"></p>
            </div>
            <div class = "points">
                <h2>Points</h2>
                <p id ="studentPoints"></p>
            </div>
        </div>

        <div class="signed-up-events">
            <h2 class="section-title">Your Events</h2>
            <div class="events-scroll-container" id="signedUpEventsContainer">
                <!-- Events will be dynamically inserted here -->
            </div>
        </div>
    </section>


    <section class="navbar" id="nav-bar">
        <div class="nav-links" id="nav-bar-nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="calendar.html">Calendar</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </div>
    </section>

    <!-- Edit Profile Modal -->
    <div class="modal" id="editProfileModal">
        <div class="modal-content edit-profile-modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button class="modal-close edit-profile-close">&times;</button>
            </div>
            <div class="modal-body">
                <form class="edit-profile-form">
                    <div class="form-group">
                        <label for="profileName">Name</label>
                        <input type="text" id="profileName" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="profileDescription">Description</label>
                        <textarea id="profileDescription" placeholder="Tell us about yourself" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="submit-profile-button">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
