<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Southport Key Club - Calendar</title>

    
    <link rel="stylesheet" href="css_files/calendar.css">
    <link rel="stylesheet" href="css_files/common.css">
    <script src ="js_files/calendar.js" defer></script>
</head>

<body>

    <section class="header">
        <div class="header-title">
            <h1>Southport Key Club</h1>
        </div>

        <div class="header-subtitle">
            <p>Calendar</p>
        </div>
    </section>


    <main class="main-content">

        <section class="calendar-card">

            <div class="calendar-header">
                <div>
                    <p class="calendar-label">Club Schedule</p>
                    <h2 id ="monthDateValue"></h2>
                </div>

                <div class="calendar-controls">
                    <button
                        class="calendar-control-button"
                        type="button"
                        aria-label="Previous month"
                        id="previousMonth"
                    >
                        &#10094;
                    </button>

                    <button
                        class="today-button"
                        type="button"
                    >
                        Today
                    </button>

                    <button
                        class="calendar-control-button"
                        type="button"
                        aria-label="Next month"
                        id = "nextMonth"
                    >
                        &#10095;
                    </button>
                </div>
            </div>


            <div class="calendar-scroll">

                <div class="calendar-weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>


                <div class="calendar-grid">
                    <!-- Calendar days will be dynamically generated by JavaScript -->
                </div>

            </div>

        </section>


        <section class="upcoming-events">

            <div class="section-heading">
                <div>
                    <p class="section-label">What’s Next</p>
                    <h2>Upcoming Events</h2>
                </div>

                <a href="events.html">View all events</a>
            </div>


            <div class="upcoming-events-grid">

                

            </div>

        </section>

    </main>


    <section class="navbar" id="nav-bar">
        <div class="nav-links" id="nav-bar-nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="calendar.html">Calendar</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
            <a href="studentlist.html">Student Directory</a>
        </div>
    </section>

    <!-- Schedule Event Modal -->
    <div id="scheduleEventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Schedule Event</h2>
                <button class="modal-close" id="closeScheduleModal">&times;</button>
            </div>
            <form id="scheduleEventForm">
                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">Start Time</label>
                    <input type="time" id="eventTime" required>
                </div>
                <div class="form-group">
                    <label for="eventEndTime">End Time</label>
                    <input type="time" id="eventEndTime" required>
                </div>
                <div class="form-group">
                    <label for="eventLocation">Location</label>
                    <input type="text" id="eventLocation" required>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-button">Schedule Event</button>
            </form>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div id="eventDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="eventDetailsTitle">Event Details</h2>
                <button class="modal-close" id="closeEventDetailsModal">&times;</button>
            </div>
            <div class="event-details-content">
                <div class="event-detail-item">
                    <span class="event-detail-label" id="event-detail-time">Time:</span>
                    <span id="eventDetailsTime" class="event-detail-value"></span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label" id="event-detail-endtime">End Time:</span>
                    <span id="eventDetailsEndTime" class="event-detail-value"></span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label" id = "event-detail-location">Location:</span>
                    <span id="eventDetailsLocation" class="event-detail-value"></span>
                </div>
                <div class="event-detail-item">
                    <span class="event-detail-label" id ="event-detail-description">Description:</span>
                    <p id="eventDetailsDescription" class="event-detail-value"></p>
                </div>
            </div>
            <div class="modal-actions">
                <button class="action-button delete-button" id="deleteEventButton" style ="color: black">Delete Event</button>
            </div>
        </div>
    </div>

</body>
</html>
